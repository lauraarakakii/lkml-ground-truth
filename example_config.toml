# =============================================================================
# Configuração do pipeline LKML5Ws + PaStA
# =============================================================================
# Edite os valores abaixo conforme seu ambiente. Não precisa mexer em nenhum
# outro arquivo do projeto para ajustar performance, caminhos ou qual lista
# processar.

[repo]
# Clonagem automática do repositório do kernel (opcional). Desligada por
# padrão: se você já tem um clone pronto em outro lugar, deixe
# auto_clone = false e só aponte "paths.repo_path" pra ele.
#
# Se ligar, o pipeline (ou "make repo" / "lkml-ground-truth clone-repo")
# clona sozinho para "paths.repo_path" caso ele ainda não exista.
auto_clone = false

# De onde clonar (o mirror oficial do Linus no kernel.org, por padrão).
clone_url = "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"

# Opcional: limita o clone a partir dessa data (formato "YYYY-MM-DD"),
# usando "git clone --shallow-since". Deixe vazio ("") para clonar o
# histórico completo do kernel (décadas, dezenas de GB).
# Útil quando você só precisa casar patches de um período recente: um
# clone raso é muito mais rápido e ocupa bem menos disco. Só tome cuidado
# pra "since" cobrir toda a janela de tempo que "matching.days_before" /
# "matching.days_after" pode precisar buscar candidatos.
since = ""


[paths]
# Repositório git do Linux (se "repo.auto_clone" estiver ligado e o
# caminho abaixo não existir ainda, ele é clonado automaticamente aqui;
# senão, precisa ser um clone real do kernel já feito por você).
repo_path = "resources/linux/repo"

# Pasta raiz do dataset, que contém as subpastas "list=<nome>/*.parquet"
dataset_root = "/path/to/mlh/output/parser/dataset"

# Qual lista processar (bate com o nome depois de "list=" nas subpastas).
# Exemplos: "netdev", "bpf", "arm-scmi", "linux-usb", etc.
# Use "all" para processar TODAS as listas encontradas em dataset_root,
# uma de cada vez, cada uma gerando seu próprio arquivo de saída.
list_name = "netdev"

# Onde salvar o resultado. "{list}" é substituído automaticamente pelo nome
# da lista sendo processada, então cada lista gera seu próprio arquivo
# (evita sobrescrever resultado de uma lista com o de outra).
output_path = "output/matches_{list}.csv"

# Cache do índice arquivo->commits (não depende da lista, é sobre o repo git;
# construído uma vez só e reaproveitado entre listas diferentes)
commit_index_cache = "commit_index_cache.pickle"


[performance]
# Quantidade de processos paralelos usados para comparar patches (a parte
# de fuzzy-matching é a que mais consome CPU).
#   0 = automático (usa todos os núcleos disponíveis menos 1)
# Ajuste esse número para controlar quantos núcleos do servidor o projeto
# vai usar -- por exemplo, se o servidor é compartilhado com outras cargas,
# reduza esse valor para não competir por CPU.
num_workers = 0

# Se true, reconstrói o índice arquivo->commits do zero mesmo se já existir
# um cache salvo (use isso se você reclonar/atualizar o repositório do linux)
rebuild_index = false

# Quantos patches cada worker processa por vez antes de pedir mais trabalho
# (chunksize do multiprocessing.Pool.imap_unordered). Valores maiores reduzem
# overhead de comunicação entre processos, mas atualizam o progresso com
# menos frequência.
chunksize = 50

# A cada quantos patches processados imprime uma linha de progresso
progress_every = 500


[matching]
# Janela de tempo (em dias) para procurar o commit correspondente a partir
# da data de envio do e-mail
days_before = 3
days_after = 365

# Thresholds do motor de comparação do PaStA (0.0 a 1.0)
autoaccept = 0.8
interactive = 0.5
diff_lines_ratio = 0.4
heading = 0.7
filename = 0.7
message_diff_weight = 0.5
